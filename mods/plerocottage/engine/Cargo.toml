[package]
name = "plerocottage-native"
version = "0.1.0"
edition = "2024"
publish = false

# data/ holds what pleromod's tools/mod-content/extract.py writes for this crate (horizon/native/*.json)
# and the runs of the mod's machines its tests compare with (output/machines.json).
[dependencies]
horizon-client = { path = "../../../crates/horizon-client", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
